<svg xmlns="http://www.w3.org/2000/svg" class="bn play" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Tools for Pymes. Arma pedidos en segundos: tu catálogo, tus precios y el total al instante.">
<style>
.bn text{font-family:"Bricolage Grotesque",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#1d3a30}
.bn .k{font-size:25px;font-weight:600;letter-spacing:2.5px}
.bn .h{font-size:86px;font-weight:800;letter-spacing:-1.5px}
.bn .s{font-size:25px;font-weight:400}
.bn .tt{font-size:31px;font-weight:800;letter-spacing:-.5px}
.bn .o{transform-box:fill-box}
.bn .sube{animation:bn-sube .7s cubic-bezier(.2,.8,.2,1) both}
.bn .raya{transform-origin:left center;animation:bn-crece .6s cubic-bezier(.2,.8,.2,1) .35s both}
.bn .mancha{transform-origin:100% 50%;animation:bn-mancha 1s cubic-bezier(.2,.8,.2,1) .1s both}
.bn .bola{transform-origin:0 100%;animation:bn-bola 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
.bn .reja{animation:bn-aparece 1.2s ease .6s both}
.bn .calc{transform-origin:center;animation:bn-calc .8s cubic-bezier(.3,1.4,.5,1) .3s both}
.bn .tecla{transform-origin:center;animation:bn-pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.75s + var(--i) * 70ms)}
.bn .mas{transform-origin:center;animation:bn-pop .45s cubic-bezier(.3,1.6,.5,1) 1.05s both,bn-pulsa 4.4s ease-in-out 1.5s infinite}
.bn .aro{transform-origin:center;opacity:0;animation:bn-aro 4.4s ease-out 1.5s infinite}
.bn .cifra{transform-origin:right center;animation:bn-cifra 4.4s cubic-bezier(.2,.8,.2,1) 1.5s infinite}
.bn .cursor{animation:bn-parpadea 1.1s steps(1) infinite}
.bn .fila{animation:bn-entra .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.55s + var(--i) * .3s)}
.bn .fila .b1,.bn .fila .b2{transform-origin:left center;animation:bn-crece .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.8s + var(--i) * .3s)}
.bn .fila .b2{animation-delay:calc(1.9s + var(--i) * .3s)}
.bn .total{animation:bn-entra .6s cubic-bezier(.2,.8,.2,1) 2.5s both}
.bn .llena{transform-origin:left center;animation:bn-crece .9s cubic-bezier(.2,.8,.2,1) 2.8s both}
.bn .brilla{animation:bn-brilla 4.4s ease-in-out 3.6s infinite}
.bn:not(.play) *{animation-play-state:paused!important}
@keyframes bn-sube{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes bn-crece{from{transform:scaleX(0)}to{transform:none}}
@keyframes bn-mancha{from{opacity:0;transform:translateX(90px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bn-bola{from{transform:scale(0)}to{transform:none}}
@keyframes bn-aparece{from{opacity:0}to{opacity:1}}
@keyframes bn-calc{from{opacity:0;transform:translateY(60px) rotate(-6deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes bn-pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes bn-pulsa{0%,8%,30%,38%,60%,68%,100%{transform:none}4%,34%,64%{transform:translateY(3px) scale(.93)}}
@keyframes bn-aro{0%,60%{opacity:0;transform:scale(1)}64%{opacity:.9;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.45)}}
@keyframes bn-cifra{0%,3%{transform:scaleX(.25)}5%,33%{transform:scaleX(.5)}35%,63%{transform:scaleX(.75)}65%,92%{transform:none}97%,100%{transform:scaleX(.25)}}
@keyframes bn-parpadea{50%{opacity:0}}
@keyframes bn-entra{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes bn-brilla{0%,70%,100%{opacity:0;transform:translateX(0)}75%{opacity:.85}95%{opacity:0;transform:translateX(120px)}}
@media (prefers-reduced-motion:reduce){.bn *{animation:none!important}.bn .aro,.bn .brilla{opacity:0}}
</style>
<rect width="1500" height="500" fill="#f7f5ef"/>
<circle class="o bola" cx="0" cy="500" r="120" fill="#d5f88a"/>

<g class="o mancha">
  <path d="M760 500C700 420 744 336 812 268C884 196 868 92 930 34C962 6 1000 0 1040 0H1500V500Z" fill="#1d4a36"/>
  <g class="reja" stroke="#f7f5ef" stroke-opacity=".14" stroke-width="1.5">
    <path d="M1320 0v74M1350 0v74M1380 0v74M1410 0v74M1440 0v74M1300 18h170M1300 46h170"/>
    <path d="M770 410v90M800 410v90M830 410v90M860 410v90M890 410v90M750 432h160M750 462h160"/>
  </g>
</g>

<g>
  <text class="k o sube" x="70" y="80">TOOLS FOR PYMES</text>
  <rect class="o raya" x="70" y="98" width="112" height="7" rx="3.5" fill="#d5f88a"/>
  <text class="h o sube" x="66" y="205" style="animation-delay:.15s">Arma pedidos</text>
  <text class="h o sube" x="66" y="292" style="animation-delay:.25s">en segundos</text>
  <text class="s o sube" x="70" y="350" style="animation-delay:.4s">Tu catálogo, tus precios y el total al instante.</text>
</g>

<g transform="translate(40 0)">
  <g class="o calc">
    <rect x="782" y="118" width="260" height="285" rx="42" fill="#13281f" opacity=".55"/>
    <rect x="770" y="104" width="260" height="285" rx="42" fill="#1d3a30" stroke="#5c9f7b" stroke-width="3"/>
    <rect x="795" y="128" width="210" height="80" rx="16" fill="#f7f5ef"/>
    <rect class="o cifra" x="878" y="161" width="104" height="14" rx="7" fill="#1d3a30"/>
    <rect class="cursor" x="988" y="152" width="4" height="32" rx="2" fill="#4a7633"/>
    <rect class="o tecla" style="--i:0" x="795" y="232" width="62" height="60" rx="14" fill="#f7f5ef"/>
    <rect class="o tecla" style="--i:1" x="867" y="232" width="62" height="60" rx="14" fill="#f7f5ef"/>
    <rect class="o tecla" style="--i:2" x="795" y="302" width="62" height="60" rx="14" fill="#f7f5ef"/>
    <rect class="o tecla" style="--i:3" x="867" y="302" width="62" height="60" rx="14" fill="#f7f5ef"/>
    <rect class="o aro" x="939" y="232" width="66" height="130" rx="16" fill="none" stroke="#d5f88a" stroke-width="4"/>
    <g class="o mas">
      <rect x="939" y="232" width="66" height="130" rx="16" fill="#d5f88a"/>
      <path d="M972 279v36M954 297h36" stroke="#1d3a30" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g class="o fila" style="--i:0">
    <rect x="1070" y="66" width="270" height="64" rx="16" fill="#f7f5ef"/>
    <g fill="none" stroke="#1d3a30" stroke-width="3" stroke-linejoin="round"><path d="M1094 88l18-9 18 9v20l-18 9-18-9z"/><path d="M1094 88l18 9 18-9M1112 97v20"/></g>
    <rect class="o b1" x="1152" y="86" width="120" height="9" rx="4.5" fill="#1d3a30"/>
    <rect class="o b2" x="1152" y="103" width="80" height="9" rx="4.5" fill="#d5f88a"/>
  </g>
  <g class="o fila" style="--i:1">
    <rect x="1070" y="144" width="270" height="64" rx="16" fill="#f7f5ef"/>
    <g fill="none" stroke="#1d3a30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M1097 164h30l3 30h-36z"/><path d="M1104 164v-4a8 8 0 0 1 16 0v4"/><path d="M1105 178l6 6 8-9" stroke="#7fb24a"/></g>
    <rect class="o b1" x="1152" y="164" width="120" height="9" rx="4.5" fill="#1d3a30"/>
    <rect class="o b2" x="1152" y="181" width="80" height="9" rx="4.5" fill="#d5f88a"/>
  </g>
  <g class="o fila" style="--i:2">
    <rect x="1070" y="222" width="270" height="64" rx="16" fill="#f7f5ef"/>
    <g fill="none" stroke="#1d3a30" stroke-width="3" stroke-linejoin="round"><rect x="1100" y="236" width="24" height="8" rx="2"/><rect x="1096" y="244" width="32" height="30" rx="6"/><path d="M1096 254h32M1096 264h32"/></g>
    <rect class="o b1" x="1152" y="242" width="120" height="9" rx="4.5" fill="#1d3a30"/>
    <rect class="o b2" x="1152" y="259" width="80" height="9" rx="4.5" fill="#d5f88a"/>
  </g>

  <g class="o total">
    <rect x="1064" y="306" width="290" height="76" rx="18" fill="#f7f5ef"/>
    <text class="tt" x="1090" y="355">Total</text>
    <path d="M1182 324v40" stroke="#1d3a30" stroke-opacity=".15" stroke-width="2"/>
    <rect x="1202" y="337" width="128" height="16" rx="8" fill="#1d3a30" opacity=".07"/>
    <rect class="o llena" x="1202" y="337" width="128" height="16" rx="8" fill="#d5f88a"/>
    <rect class="o brilla" x="1204" y="339" width="18" height="12" rx="6" fill="#fff" opacity="0"/>
  </g>
</g>
</svg>
