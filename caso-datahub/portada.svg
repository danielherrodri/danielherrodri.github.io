<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="Animación editorial Data Hub: Operación, orquestación e inteligencia artificial, datos y calidad.">
<title>Data Hub / QA Ops Toolkit — Menos tareas manuales. Más ingeniería.</title>
<desc>Diagrama conceptual animado en verde bosque y marfil. Tres capacidades se conectan mediante flujos de datos. Sin datos operativos reales.</desc>
<style>
  .trace{fill:none;stroke:#1C543A;stroke-width:3;stroke-linecap:round}
  .motion{stroke-dasharray:10 18;animation:dash 4.5s linear infinite}
  .layer{transform-box:fill-box;transform-origin:center;animation:breathe 5.5s ease-in-out infinite}
  .layer.two{animation-delay:-1.8s}
  .layer.three{animation-delay:-3.5s}
  .caption{font-family:Arial,Helvetica,sans-serif}
  .spark{animation:pulse 2.6s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-112}}
  @keyframes breathe{0%,100%{transform:translateY(0px)}50%{transform:translateY(-5px)}}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
